name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: odyssey
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d odyssey"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------
      # Python
      # --------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: odyssey-py/pyproject.toml

      - name: Install Python package
        working-directory: odyssey-py
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Initialize Odyssey database
        working-directory: odyssey-py
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/odyssey
        run: |
          python -c "from odyssey import Odyssey; Odyssey().init_db()"

      - name: Run Python tests
        working-directory: odyssey-py
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/odyssey
        run: |
          pytest

      # --------------------
      # Go
      # --------------------

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
          cache-dependency-path: odyssey-go/go.sum

      - name: Run Go tests
        working-directory: odyssey-go
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/odyssey
        run: |
          go test ./...