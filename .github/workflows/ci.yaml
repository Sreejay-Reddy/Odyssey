name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: odyssey_py
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d odyssey_py"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: odyssey-py/pyproject.toml

      - name: Install package
        working-directory: odyssey-py
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Initialize Odyssey database
        working-directory: odyssey-py
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/odyssey_py
        run: |
          python -c "from odyssey import Odyssey; Odyssey().init_db()"

      - name: Run Python tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/odyssey_py
        run: |
          pytest


  go-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: odyssey_go
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d odyssey_go"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache: true
          cache-dependency-path: odyssey-go/go.sum

      - name: Reset and initialize Go test database
        working-directory: odyssey-go
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/odyssey_go
        run: |
          go run ./cmd/testdb

      - name: Run Go tests
        working-directory: odyssey-go
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/odyssey_go
        run: |
          go test ./... -count=1