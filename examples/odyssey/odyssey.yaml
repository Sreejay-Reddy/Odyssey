
version : 1

agent:
    workpool:
        maxsize: 64
        interval: 100ms
    sdk:
        workers: 4
        batchsize: 1024
    postgres:
        pool_size: 15

registry:
  default:
    retry:
      policy: forever
      delay: 2s

    on_failure:
      notify: slack
      wait_for_input: true
